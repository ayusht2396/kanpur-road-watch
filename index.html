<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanpur Road Watch</title>
<meta name="theme-color" content="#14181d">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181d;--sub:#5d6772;--card:#fff;--glass:rgba(255,255,255,.82);--bd:rgba(20,24,29,.1);--fill:#eef0f2;
--brand:#14181d;--onbrand:#fff;--lane:#ffc61a;--sh:0 12px 40px rgba(15,23,42,.18);
--minor:#e3b505;--moderate:#f0801a;--severe:#e03a24;--dangerous:#8b27b8}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f4;--sub:#9aa5b1;--card:#1f252c;--glass:rgba(24,29,35,.82);--bd:rgba(255,255,255,.1);--fill:#2a3139;--brand:#ffc61a;--onbrand:#14181d;--sh:0 12px 40px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--fill)}
button,input,textarea{font:inherit;color:inherit}
#map{position:fixed;inset:0}
#sheet{position:absolute;z-index:1100;left:16px;top:16px;bottom:16px;width:396px;display:flex;flex-direction:column;background:var(--glass);
 -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);overflow:hidden}
.head{padding:18px 18px 12px;display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:13px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo i{display:block;width:4px;height:22px;background:repeating-linear-gradient(var(--onbrand) 0 6px,transparent 6px 10px);border-radius:2px}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--sub);margin-top:2px}
#fold{margin-left:auto;display:none;border:0;background:var(--fill);width:34px;height:34px;border-radius:50%;cursor:pointer}
.cta{margin:0 18px 12px;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;background:var(--brand);color:var(--onbrand);display:flex;justify-content:center;gap:8px;align-items:center;transition:transform .12s}
.cta:active{transform:scale(.98)}
.body{flex:1;overflow:auto;padding:0 18px 18px;min-height:0}
.view{display:none}.view.on{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;gap:7px;align-items:center}
.chip[aria-pressed=false]{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.card{display:flex;gap:12px;padding:10px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:16px;cursor:pointer;width:100%;text-align:left;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,23,42,.1)}
.thumb{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:none;background:var(--fill);display:grid;place-items:center}
.card b{font-size:14px;display:block}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff;background:var(--c);margin-bottom:4px}
.meta{font-size:12px;color:var(--sub);line-height:1.4}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:28px 10px}
.back{border:0;background:none;font-weight:700;cursor:pointer;padding:0 0 10px;font-size:14px;color:var(--sub)}
.pinbox{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--fill);font-size:13px;margin-bottom:6px}
.pinbox.ok{background:rgba(46,160,67,.16)}
h3{font-size:12.5px;margin:16px 0 8px;font-weight:700;color:var(--sub)}
.sevs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative;border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:10px 10px 10px 14px;cursor:pointer;overflow:hidden}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.opt:has(input:focus-visible),.cta:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.opt b{font-size:14px;display:block}.opt span{font-size:11.5px;color:var(--sub);line-height:1.3;display:block;margin-top:2px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types .opt{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600}.types .opt::before{display:none}
.types .opt:has(input:checked){border-color:var(--brand);background:var(--brand);color:var(--onbrand)}
textarea{width:100%;min-height:68px;resize:vertical;padding:11px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--card)}
.drop{display:block;border:2px dashed var(--bd);border-radius:14px;padding:16px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sub);background:var(--card)}
.drop input{display:none}
#preview{display:none;width:100%;max-height:170px;object-fit:cover;border-radius:12px;margin-top:8px}
#loc{position:absolute;z-index:1000;top:96px;right:10px;width:34px;height:34px;border:2px solid rgba(0,0,0,.2);background:#fff;border-radius:4px;cursor:pointer;color:#222;padding:0;font-size:17px}
#toast{position:fixed;z-index:2000;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--brand);color:var(--onbrand);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--sh);transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--severe);color:#fff}
.pin{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.pin.d{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent),0 3px 10px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 16px transparent,0 3px 10px rgba(0,0,0,.35)}}
.leaflet-popup-content-wrapper{border-radius:18px;background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.leaflet-popup-tip{background:var(--card)}.leaflet-popup-content{margin:14px 16px;font-family:inherit}
.pop img{width:100%;height:130px;object-fit:cover;border-radius:12px;margin:8px 0}
.pop .row{display:flex;gap:6px;margin-top:10px}
.pop button{flex:1;border:1px solid var(--bd);background:var(--fill);border-radius:10px;padding:8px;font-weight:700;font-size:12.5px;cursor:pointer}
@media(prefers-color-scheme:dark){.leaflet-bar a{background:#1f252c;color:#eee;border-color:#333}.leaflet-control-attribution{background:rgba(20,24,29,.7)!important;color:#aaa}.leaflet-control-attribution a{color:#ccc}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){
 #sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));top:auto;width:auto;max-height:58vh;border-radius:22px}
 .head{padding:14px 14px 10px}#fold{display:block}.cta{margin:0 14px 10px;padding:12px}.body{padding:0 14px 14px}
 #sheet.min .body{display:none}#sheet.min .cta{margin-bottom:14px}
 #loc{top:12px}.leaflet-top.leaflet-right{margin-top:48px}
}
</style>
</head>
<body>
<div id="map"></div>
<button id="loc" type="button" aria-label="Go to my location" title="My location">◎</button>

<section id="sheet" aria-label="Road reports">
  <div class="head">
    <div class="logo" aria-hidden="true"><i></i></div>
    <div><h1>Kanpur Road Watch</h1><div class="sub" id="stats">Loading reports…</div></div>
    <button id="fold" type="button" aria-label="Expand or collapse panel">⌄</button>
  </div>
  <button class="cta" id="cta" type="button"><span style="font-size:18px">＋</span> Report a bad road</button>
  <div class="body">
    <div class="view on" id="v-list">
      <div class="chips" id="filters"></div>
      <div id="list"></div>
    </div>
    <form class="view" id="v-report" novalidate>
      <button class="back" type="button" id="back">← Back to reports</button>
      <div class="pinbox" id="where"><span style="font-size:20px">📍</span><span>Tap the map where the road is damaged, or use the ◎ button for your location.</span></div>
      <h3>How bad is it?</h3>
      <div class="sevs" id="sev"></div>
      <h3>What is the problem?</h3>
      <div class="types" id="types"></div>
      <h3>Landmark or details (optional)</h3>
      <textarea id="desc" maxlength="400" placeholder="Near Rawatpur crossing, opposite the petrol pump"></textarea>
      <h3>Photo (optional)</h3>
      <label class="drop" id="drop"><input type="file" id="photo" accept="image/*"><span id="droptxt">📷 Add a photo</span></label>
      <img id="preview" alt="Selected photo preview">
      <button class="cta" id="submit" type="submit" style="margin:18px 0 0;width:100%">Submit report</button>
    </form>
  </div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SEV = {
  minor:{label:'Minor',c:'#e3b505',d:'Bumpy but easy to drive'},
  moderate:{label:'Moderate',c:'#f0801a',d:'Slows traffic down'},
  severe:{label:'Severe',c:'#e03a24',d:'Can damage vehicles'},
  dangerous:{label:'Dangerous',c:'#8b27b8',d:'Risk of accidents'}
};
const TYPE = {pothole:'Pothole',broken:'Broken or uneven road',waterlogging:'Waterlogging',manhole:'Open or missing manhole',other:'Other'};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let reports = [], draft = null, draftMarker = null, photoBlob = null, markers = {}, view = 'list', active = new Set(Object.keys(SEV));

const map = L.map('map', {zoomControl:false}).setView([26.4499, 80.3319], 12);
L.control.zoom({position:'topright'}).addTo(map);
const mq = matchMedia('(prefers-color-scheme: dark)'); let tiles;
function setTiles() {
  if (tiles) map.removeLayer(tiles);
  const key = (window.CONFIG && window.CONFIG.cartoKey) ? '?key=' + encodeURIComponent(window.CONFIG.cartoKey) : '';
  tiles = L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/${mq.matches ? 'dark_all' : 'voyager'}/{z}/{x}/{y}.png${key}`,
    {subdomains:'abcd', maxZoom:20, attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map);
}
setTiles(); mq.addEventListener('change', setTiles);

function toast(t, err) {
  const el = $('toast'); el.textContent = t; el.className = 'on' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.className = '', 3200);
}
function setView(v) {
  view = v; $('v-list').classList.toggle('on', v === 'list'); $('v-report').classList.toggle('on', v === 'report');
  $('cta').style.display = v === 'list' ? '' : 'none';
  if (v === 'report') { map.closePopup(); $('sheet').classList.remove('min'); }
  else if (draftMarker) { map.removeLayer(draftMarker); draftMarker = draft = null; resetWhere(); }
  $('sheet').querySelector('.body').scrollTop = 0;
}
$('cta').onclick = () => setView('report');
$('back').onclick = () => setView('list');
$('fold').onclick = () => $('sheet').classList.toggle('min');

$('filters').innerHTML = Object.entries(SEV).map(([k,v]) =>
  `<button type="button" class="chip" data-k="${k}" aria-pressed="true"><span class="dot" style="--c:${v.c}"></span>${v.label}</button>`).join('');
$('filters').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k; active.has(k) ? active.delete(k) : active.add(k);
  b.setAttribute('aria-pressed', active.has(k)); render();
};
$('sev').innerHTML = Object.entries(SEV).map(([k,v]) =>
  `<label class="opt" style="--c:${v.c}"><input type="radio" name="sev" value="${k}"${k==='moderate'?' checked':''}><b>${v.label}</b><span>${v.d}</span></label>`).join('');
$('types').innerHTML = Object.entries(TYPE).map(([k,v],i) =>
  `<label class="opt"><input type="radio" name="type" value="${k}"${i===0?' checked':''}>${v}</label>`).join('');

function resetWhere() {
  $('where').className = 'pinbox';
  $('where').innerHTML = '<span style="font-size:20px">📍</span><span>Tap the map where the road is damaged, or use the ◎ button for your location.</span>';
}
function setDraft(ll) {
  draft = ll;
  if (draftMarker) draftMarker.setLatLng(ll);
  else draftMarker = L.marker(ll, {draggable:true}).addTo(map).on('dragend', e => setDraft(e.target.getLatLng()));
  $('where').className = 'pinbox ok';
  $('where').innerHTML = `<span style="font-size:20px">✅</span><span>Pin placed (${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}). Drag it to fine-tune.</span>`;
}
map.on('click', e => { if (view === 'report') setDraft(e.latlng); });
$('loc').onclick = () => {
  if (!navigator.geolocation) return toast('Location is not available. Tap the map instead.', true);
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    map.flyTo(ll, 17); if (view === 'report') setDraft(ll);
  }, () => toast('Could not get your location. Allow access, or tap the map.', true), {enableHighAccuracy:true, timeout:15000});
};

$('photo').onchange = async e => {
  const f = e.target.files[0]; photoBlob = null; $('preview').style.display = 'none'; $('droptxt').textContent = '📷 Add a photo';
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f), s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = bmp.width * s; c.height = bmp.height * s;
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    photoBlob = await new Promise(r => c.toBlob(r, 'image/jpeg', .8));
    $('preview').src = URL.createObjectURL(photoBlob); $('preview').style.display = 'block'; $('droptxt').textContent = '📷 Change photo';
  } catch { toast('That file could not be read as an image.', true); e.target.value = ''; }
};

$('v-report').onsubmit = async e => {
  e.preventDefault();
  if (!sb) return toast('Supabase is not configured yet. Add the project URL and anon key to config.js.', true);
  if (!draft) return toast('Place a pin on the map first.', true);
  const inKanpur = draft.lat >= 26.30 && draft.lat <= 26.60 && draft.lng >= 80.15 && draft.lng <= 80.55;
  if (!inKanpur) return toast('The pin must be inside Kanpur.', true);
  $('submit').disabled = true; $('submit').textContent = 'Submitting…';
  let uploadedPath = null;
  try {
    if (photoBlob) {
      uploadedPath = crypto.randomUUID() + '.jpg';
      const up = await sb.storage.from('road-photos').upload(uploadedPath, photoBlob, {contentType:'image/jpeg'});
      if (up.error) throw up.error;
    }
    const ins = await sb.from('reports').insert({
      lat:draft.lat, lng:draft.lng, photo_path:uploadedPath, description:$('desc').value.trim(),
      severity:document.querySelector('input[name=sev]:checked').value,
      type:document.querySelector('input[name=type]:checked').value
    }).select(COLS).single();
    if (ins.error) throw ins.error;
    const j = norm(ins.data);
    reports.push(j); $('v-report').reset(); photoBlob = null; $('preview').style.display = 'none'; $('droptxt').textContent = '📷 Add a photo';
    setView('list'); render(); toast('Report submitted. Thank you!');
    map.flyTo([j.lat, j.lng], Math.max(map.getZoom(), 16)); setTimeout(() => markers[j.id] && markers[j.id].openPopup(), 900);
  } catch (err) {
    toast(err.message || 'Could not submit. Check your connection.', true);
  }
  $('submit').disabled = false; $('submit').textContent = 'Submit report';
};

function ago(iso) {
  const d = Math.floor((Date.now() - new Date(iso)) / 864e5);
  return d < 1 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago';
}
function popup(r) {
  const s = SEV[r.severity];
  return `<div class="pop"><span class="badge" style="--c:${s.c}">${s.label}</span> <b>${TYPE[r.type]}</b>
  ${r.description ? `<div class="meta" style="margin-top:4px">${esc(r.description)}</div>` : ''}
  ${r.photo ? `<a href="${r.photo}" target="_blank" rel="noopener"><img src="${r.photo}" alt="Road photo"></a>` : ''}
  <div class="meta">${ago(r.createdAt)} · ${r.confirmVotes} confirmed</div>
  <div class="row"><button data-v="confirm" data-id="${r.id}">Still bad</button><button data-v="fixed" data-id="${r.id}">It's fixed</button></div></div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  b.disabled = true;
  try {
    const v = await sb.rpc('vote_report', {report_id:b.dataset.id, kind:b.dataset.v});
    if (v.error) throw v.error;
    await load();
    map.closePopup(); render(); toast('Thanks, your vote is recorded.');
  } catch (err) { toast(err.message, true); b.disabled = false; }
});

function render() {
  Object.values(markers).forEach(m => map.removeLayer(m)); markers = {};
  const shown = reports.filter(r => active.has(r.severity)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  shown.forEach(r => {
    const s = SEV[r.severity];
    markers[r.id] = L.marker([r.lat, r.lng], {icon:L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15],
      html:`<div class="pin${r.severity==='dangerous'?' d':''}" style="--c:${s.c}">${r.severity==='dangerous'?'!':''}</div>`})})
      .addTo(map).bindPopup(popup(r), {minWidth:230, autoPanPadding:[30,30]});
  });
  $('list').innerHTML = shown.length ? shown.map(r => { const s = SEV[r.severity]; return `<button class="card" data-focus="${r.id}">
    ${r.photo ? `<img class="thumb" src="${r.photo}" alt="" loading="lazy">` : `<span class="thumb"><span class="dot" style="--c:${s.c};width:18px;height:18px"></span></span>`}
    <span><span class="badge" style="--c:${s.c}">${s.label}</span><b>${TYPE[r.type]}</b>
    <span class="meta">${esc(r.description || 'No details added')}<br>${ago(r.createdAt)} · ${r.confirmVotes} confirmed</span></span></button>`; }).join('')
    : '<div class="empty">No reports here yet.<br>Tap “Report a bad road” to add the first one.</div>';
  const sv = reports.filter(r => r.severity === 'severe' || r.severity === 'dangerous').length;
  $('stats').textContent = reports.length ? `${reports.length} open reports · ${sv} severe or dangerous` : 'No open reports yet';
}
$('list').onclick = e => {
  const it = e.target.closest('[data-focus]'); if (!it) return;
  const m = markers[it.dataset.focus]; map.flyTo(m.getLatLng(), 17); setTimeout(() => m.openPopup(), 700);
  if (innerWidth <= 760) $('sheet').classList.add('min');
};

const CFG = window.CONFIG || {};
const sb = (window.supabase && CFG.supabaseUrl && CFG.supabaseKey)
  ? supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey)
  : null;
const COLS = 'id,lat,lng,severity,type,description,photo_path,created_at,confirm_votes,fixed_votes';
const norm = r => ({id:r.id, lat:r.lat, lng:r.lng, severity:r.severity, type:r.type, description:r.description || '',
  photo: r.photo_path ? sb.storage.from('road-photos').getPublicUrl(r.photo_path).data.publicUrl : null,
  createdAt:r.created_at, confirmVotes:r.confirm_votes, fixedVotes:r.fixed_votes});
async function load() {
  const q = await sb.from('reports').select(COLS).lt('fixed_votes', 3).order('created_at', {ascending:false}).limit(1000);
  if (q.error) throw q.error;
  reports = q.data.map(norm); render();
}
if (!sb) toast('Setup missing: add your Supabase details to config.js', true);
else load().catch(err => toast(err.message || 'Could not load reports. Refresh to try again.', true));
</script>
</body>
</html>
